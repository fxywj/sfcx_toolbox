[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sfcx"
version = "0.2.0"
description = "Structure-function coupling explorer: a coordinate system for SFC analyses"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "SFCX contributors"}]
keywords = ["neuroimaging", "structure-function coupling", "connectome", "reproducibility"]
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
    "matplotlib>=3.6",
]

[project.optional-dependencies]
full = ["pandas>=1.5", "scikit-learn>=1.2", "pyyaml>=6.0"]
dev = ["pytest>=7.0"]

[project.scripts]
sfcx = "sfcx.cli:main"

[tool.setuptools.packages.find]
include = ["sfcx*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
